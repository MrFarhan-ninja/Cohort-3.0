<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pikachu Layout</title>
<link rel="stylesheet" href="style.css">
   
</head>
<body>

  <div class="container">

    <div class="right"></div>

    <div class="logo">Pokémon</div>

    <div class="menu">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <div class="content">
      <div class="small-title">POKEMON GEN I</div>

      <div class="title">Pikachu</div>

      <div class="desc">
        Pikachu is an Electric-type Pokémon introduced
        in Generation I. Pikachu are small, chubby,
        and incredibly cute mouse-like Pokémon.
        They are almost completely covered by
        yellow fur.
      </div>
    </div>

    <div class="slide">
      <div class="line"></div>
      <div class="slide-text">01 / 08</div>
    </div>

    <div class="pokeball"></div>

    <!-- Replace with your image -->
    <img src="./one.jpg" class="pikachu" alt="pikachu">

    <div class="dots">
      <div class="dot active"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>

  </div>

</body>
</html>
