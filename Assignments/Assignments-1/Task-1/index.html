<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="mainSection">

        <!-- LEFT SECTION -->

        <div class="left">

            <div id="logo">
                <img src="./logo.png" alt="pokemon-logo">
            </div>

            <h4>POKEMON GEN I</h4>

            <h1>Pikachu</h1>

            <p class="description">
                Pikachu is an Electric-type Pokémon introduced
                in Generation I. Pikachu are small, chubby,
                and incredibly cute mouse-like Pokémon.
                They are almost completely covered by
                yellow fur.
            </p>

            <div class="pagination">
                <hr>
                <p>01 / 08</p>
            </div>

            <div id="circleShape"></div>
            <div id="circleShape1"></div>

        </div>



        <!-- RIGHT SECTION -->

        <div class="right">

            <div class="menu"></div>

            <div class="dots">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </div>

        </div>



        <!-- PIKACHU IMAGE -->

        <div id="pokemonImage">
            <img src="./pikachu.png" alt="pikachu">
        </div>

    </div>

</body>
</html>
